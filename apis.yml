- name: SAP NS2 (SAP National Security Services)
  description: |
    SAP NS2 is an independent US subsidiary of SAP SE that operates SAP
    cloud and software workloads for the US federal government, the
    Department of Defense, the Intelligence Community, and commercially
    regulated industries. NS2 runs three distinct environments — the
    Cloud Intelligence Enterprise (CIE) aligned with FedRAMP for federal
    civilian and state/local agencies, a DoD cloud environment for
    defense customers, and the Commercially Regulated Environment (CRE)
    for compliance-driven private-sector workloads — typically on top of
    AWS, Microsoft Azure, and Google Cloud.

    NS2 does not publish its own public OpenAPI surface; customer access
    is mediated through cleared support channels and authority-to-operate
    boundaries. This entry documents NS2 as a related US subsidiary that
    surfaces SAP's standard product APIs (S/4HANA, SuccessFactors, BTP,
    HANA, Ariba, Analytics Cloud, Integration Suite) inside FedRAMP /
    IL-rated boundaries.
