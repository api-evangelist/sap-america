name: SAP America
description: |
  SAP America, Inc. is the US subsidiary of SAP SE, headquartered in
  Newtown Square, Pennsylvania, and serving as the Americas headquarters
  for the parent company's enterprise software portfolio (ERP, SCM, CRM,
  HCM, analytics, and cloud platform). SAP America itself does not
  publish a US-specific developer portal or APIs distinct from the parent
  SAP SE surface — all API documentation, SDKs, and OpenAPI artifacts are
  catalogued under the sibling `sap` repository (api.sap.com, SAP
  Business Accelerator Hub, SAP BTP).

  This repo is a subsidiary placeholder that exists to (1) record SAP
  America as a distinct US legal entity for partnership, public-sector,
  procurement, and FedRAMP / GovCloud contexts, and (2) cross-link to
  related US-only sibling subsidiaries — most importantly SAP NS2 (SAP
  National Security Services), the independent US subsidiary that
  operates SAP workloads in the Cloud Intelligence Enterprise (CIE), the
  DoD cloud environment, and the Commercially Regulated Environment
  (CRE) for federal, defense, and intelligence community customers.

  No tier-1 API artifacts (OpenAPI, AsyncAPI, JSON Schema, capabilities,
  plans, rate limits, FinOps) are generated in this repo per the
  api-evangelist no-empty-artifact rule — they are maintained under the
  parent `sap` repo and the per-product child repos
  (`sap-business-technology-platform`, `sap-successfactors`,
  `sap-ariba`, `sap-concur`, `sap-fieldglass`, `sap-api-management`,
  `sap-integration-suite`).
